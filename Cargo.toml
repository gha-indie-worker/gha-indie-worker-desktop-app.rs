    [package]
    name = "gha-indie-worker-desktop-app"
    version = "0.1.0"
    edition = "2021"
    license = "MIT"
    description = "Native Rust desktop app for GHA Indie Worker"
    repository = "https://github.com/gha-indie-worker/gha-indie-worker-desktop-app.rs"
    default-run = "ghaiw-desktop"

    [lib]
    name = "gha_indie_worker_desktop_core"
    path = "src/lib.rs"

    [[bin]]
    name = "ghaiw-desktop"
    path = "src/main.rs"

    [dependencies]
    serde = { version = "1", features = ["derive"] }
    serde_json = "1"

[lints.rust]
unsafe_code = "forbid"


