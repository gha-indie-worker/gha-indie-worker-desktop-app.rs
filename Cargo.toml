[package]
name = "gha-indie-worker-desktop-app"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
description = "Native Rust desktop app for GHA Indie Worker"
repository = "https://github.com/gha-indie-worker/gha-indie-worker-desktop-app.rs"
default-run = "ghaiw-desktop"

[lib]
name = "gha_indie_worker_desktop_core"
path = "src/lib.rs"

[[bin]]
name = "ghaiw-desktop"
path = "src/main.rs"

[dependencies]
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = { version = "1", default-features = false, features = ["backend-winit", "renderer-software", "compat-1-2"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
needless_return = "allow"
