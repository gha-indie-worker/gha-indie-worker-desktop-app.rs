name: App surface parity

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-surface-parity-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate Rust desktop and Flutter mobile/desktop parity
        shell: bash
        run: |
          set -euo pipefail
          readonly validator_sha='9d362edcdb0ca4aa0f2779258fa05128124c7f35'
          readonly validator_url="https://raw.githubusercontent.com/22-factor-apps/22-factor-apps-audit/${validator_sha}/tools/app_surface_parity.py"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            "$validator_url" --output /tmp/app_surface_parity.py
          python3 /tmp/app_surface_parity.py \
            --implementation rust \
            --local-repository gha-indie-worker/gha-indie-worker-desktop-app.rs \
            --peer-repository gha-indie-worker/gha-indie-worker-flutter \
            --receipt-out app-surface-parity-receipt.json
          {
            echo '## App surface parity receipt'
            echo
            echo '```json'
            cat app-surface-parity-receipt.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
