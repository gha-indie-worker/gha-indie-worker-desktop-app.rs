name: format-lock-once

on:
  push:
    branches:
      - alexanderdmills/den-3045-desktop-app-hardening

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: alexanderdmills/den-3045-desktop-app-hardening
          persist-credentials: true
      - name: Install Rust 1.90
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: "1.90.0"
          components: rustfmt
      - name: Format, lock, and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.90.0 fmt --all
          cargo +1.90.0 generate-lockfile
          git rm .github/workflows/format-lock-once.yml
          git add Cargo.lock src Cargo.toml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style: format app and commit deterministic Cargo.lock'
          git push origin HEAD:alexanderdmills/den-3045-desktop-app-hardening
